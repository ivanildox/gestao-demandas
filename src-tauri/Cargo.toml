[package]
name = "gestao_demandas"
version = "0.2.0"
description = "Sistema Desktop de Gestão de Demandas em Rust + egui"
authors = ["Gestão de Demandas"]
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.29", features = ["datepicker"] }
rfd = "0.15"
open = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
unicode-normalization = "0.1"
csv = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
