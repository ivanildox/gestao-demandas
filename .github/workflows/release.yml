name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar toolchain Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build release
        working-directory: src-tauri
        run: cargo build --release --verbose

      - name: Renomear executável
        shell: pwsh
        run: |
          Copy-Item src-tauri\target\release\gestao_demandas.exe gestao_demandas.exe

      - name: Upload artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: gestao_demandas-windows
          path: gestao_demandas.exe

      - name: Publicar na Release (quando disparado por tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: gestao_demandas.exe
          generate_release_notes: true
